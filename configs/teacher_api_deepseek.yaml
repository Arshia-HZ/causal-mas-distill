# Teacher model configuration - API-based DeepSeek
# Used for generating debates on Colab (CPU)

teacher:
  # API Configuration
  provider: openai_compatible
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  
  # Generation settings
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  
  # Debate settings
  max_rounds: 3
  n_solutions_per_problem: 1
  
  # Caching
  cache_dir: data/cache/teacher_api
  enable_cache: true