# Teacher configuration.
#
# CORRECTED 2026-08-12.
#   max_tokens was 768 while traces were actually generated at 1024.
#   scripts/00c_headroom_audit.py reads THIS file, so the audit arms were
#   silently generating under a different cap than the traces they are
#   compared against. The old comment claiming 01_generate_debates.py never
#   passes max_tokens has been false since that script was patched.
#
# Anything that changes a cache key is marked LOCKED. Changing a LOCKED value
# invalidates cache_debates_v2.jsonl and costs real money on the next run.

teacher:
  provider: openai_compatible
  base_url: https://api.generalcompute.com/v1   # LOCKED
  model: deepseek-v3.2                          # LOCKED
  api_key_env: GC_API_KEY

  temperature: 0.7                              # LOCKED
  max_tokens: 1024                              # LOCKED  (was 768)
  top_p: 0.95

  # Provider caps n per request at 8. The backend chunks larger n and folds
  # the chunk index into the cache key.
  max_n_per_request: 8

  # Total context is 8192 tokens, prompt + completion. Not 32k.
  context_limit: 8192

  max_rounds: 3
  n_solutions_per_problem: 3

  cache_dir: /content/drive/MyDrive/cmd
  cache_file: cache_debates_v2.jsonl
  enable_cache: true
