[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-mas-distill"
version = "0.1.0"
description = "Causal MAS Distillation: Improving Student Models with Causal Selection"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Arshia HZ", email = "info@arshialab.ir"}
]
requires-python = ">=3.10"
keywords = ["causal", "distillation", "llm", "reasoning", "debate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "trl>=0.7.6",
    "peft>=0.7.1",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.19.0",
    "openai>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
api = [
    "openai>=1.0.0",
    "tenacity>=8.2.0",
    "math-verify>=0.2.0",
]
train = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "trl>=0.7.6",
    "peft>=0.7.1",
    "vllm>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Arshia-HZ/causal-mas-distill"
Repository = "https://github.com/Arshia-HZ/causal-mas-distill"
Documentation = "https://github.com/Arshia-HZ/causal-mas-distill#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]